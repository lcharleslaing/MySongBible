[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apptemplatebase-backend"
version = "0.1.0"
description = "Local FastAPI backend for AppTemplateBase"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "fastapi>=0.115.0,<1.0.0",
  "pydantic-settings>=2.6.1",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.1",
  "sqlmodel>=0.0.22",
  "uvicorn[standard]>=0.32.0,<1.0.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.2",
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
